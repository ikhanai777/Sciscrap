[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sciscrap"
version = "1.0.0"
description = "Find highly cited papers on a subject and bulk-download them by DOI (open access + Sci-Hub)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "PySocks>=1.7"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
sciscrap = "sciscrap.cli:main"
sciscrap-mcp = "sciscrap.mcp_server:main"

[tool.setuptools]
packages = ["sciscrap"]
